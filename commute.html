<!doctype html>
<!--
  commute.html — 物件ページに埋め込む「会社・目的地までの距離」（KATAROKU）

  会社の住所かビル名を入れると、物件からの直線距離を出し、電車・自転車での行き方は Googleマップを開くリンクで案内する。
  ・物件の位置は ?ll=緯度,経度 で渡す（?lat=…&lng=… でも可）
  ・位置の検索: 住所は国土地理院の住所検索、ビル名は OpenPOI API（施設の住所を取り、その住所を国土地理院の検索で位置にする）
  ※ このファイルは kataroku-bot リポジトリの widgets/commute.html を写したもの。直す時はそちらを直して写す
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>会社までの距離</title>
<style>
  :root { --red: #d61d1d; --ink: #333; --sub: #666; --line: #ccc; }
  * { box-sizing: border-box; }
  /* ⚠ 埋め込みの高さは固定（add_commute_widget.js の HEIGHT）。強調文（ファーストビュー）に置くので背を低く詰めてある。
       幅320px（パソコンの右の欄）と356px（スマホ）で、最初・結果・候補ありのどれもが枠に収まり、下が空きすぎないか測ってから変えること
     ⚠ 背景は付けない（透明）。建物ページの灰色の欄（#eee）がそのまま見える。左右の余白も無しにして、上の行と頭を揃える */
  html, body { background: transparent; }
  body { margin: 0; padding: 2px 0; font: 14px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; color: var(--ink); }
  h1 { font-size: 13px; margin: 0 0 5px; color: var(--red); letter-spacing: .03em; }
  form { display: flex; gap: 6px; }
  input[type=text] { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 16px; background: #fff; color: var(--ink); }
  button { padding: 7px 14px; border: 0; border-radius: 6px; background: var(--red); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; }
  .help { margin: 5px 0 0; font-size: 12px; color: var(--sub); line-height: 1.5; }
  .msg { margin: 5px 0 0; font-size: 12px; color: var(--sub); line-height: 1.5; }
  .result { margin-top: 5px; }
  .to { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .to select { max-width: calc(100% - 3em); font-size: 12px; color: var(--ink); padding: 1px 2px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; }
  .km { font-size: 20px; font-weight: 700; line-height: 1.35; white-space: nowrap; }
  .km small { font-size: 11px; font-weight: 400; color: var(--sub); margin-left: 4px; }
  .links { display: flex; gap: 6px; }
  .links a { display: inline-block; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--red); color: var(--red); background: #fff; text-decoration: none; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .note { font-size: 10.5px; color: var(--sub); margin: 2px 0 0; line-height: 1.45; }
  .credit { font-size: 10px; color: #999; margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .credit a { color: #999; }
</style>
</head>
<body>
<h1>この物件から会社・目的地までの距離</h1>
<form id="f">
  <input type="text" id="q" placeholder="会社の住所かビル名" autocomplete="off" aria-label="会社の住所かビル名">
  <button id="go" type="submit">調べる</button>
</form>
<div id="out"><p class="help">会社の住所（例：渋谷区渋谷2-24-12）かビル名（例：六本木ヒルズ）を入れると、この物件からの直線距離と電車での行き方が分かります。家賃補助の「半径◯km以内」の確認にも。</p></div>
<p class="credit">位置の検索：<a href="https://maps.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a>・<a href="https://openpoiapi.com/attribution.html" target="_blank" rel="noopener">OpenPOI API</a></p>

<script>
(() => {
  const P = new URLSearchParams(location.search);
  // 建物の位置は ?ll=緯度,経度（備考の iframe はこの形。& を使うと CMS や HTML で &lng が文字参照に化ける心配がある）
  // ⚠ Number(null) は 0 になり、位置が無いのに赤道上の(0,0)から測ってしまう。parseFloat なら NaN
  const ll = (P.get('ll') || '').split(',');
  const ORIGIN = { lat: parseFloat(P.get('lat') ?? ll[0]), lng: parseFloat(P.get('lng') ?? ll[1]) };
  const $ = id => document.getElementById(id);
  const out = $('out');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (!isFinite(ORIGIN.lat) || !isFinite(ORIGIN.lng)) { $('go').disabled = true; out.innerHTML = '<p class="msg">物件の位置が設定されていません。</p>'; return; }

  // 首都圏だけを候補にする（同じ地名が全国にあるため）
  const AREA = /^(東京都|神奈川県|埼玉県|千葉県)/;
  const half = s => String(s || '').replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－‐―−]/g, '-');
  const key = s => half(s).replace(/[\s　・･]/g, '').toLowerCase();
  const short = t => half(t).replace(AREA, '');   // 「東京都渋谷区渋谷二丁目２４番１２号」→「渋谷区渋谷二丁目24番12号」（枠に収めるため短く）

  // 2点の直線距離（m）
  const dist = (a, b) => {
    const R = 6371008.8, r = Math.PI / 180;
    const h = Math.sin((b.lat - a.lat) * r / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lng - a.lng) * r / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  const fmt = m => m < 1000 ? `約${Math.round(m / 10) * 10}m` : `約${(m / 1000).toFixed(2)}km`;

  async function gsi(q) {
    const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('住所検索に失敗しました');
    return (await r.json())
      .filter(x => AREA.test(x.properties.title))
      .map(x => ({ label: short(x.properties.title), lat: x.geometry.coordinates[1], lng: x.geometry.coordinates[0] }));
  }
  async function poi(q) {
    const r = await fetch('https://api.openpoiapi.com/v1/search?q=' + encodeURIComponent(q) + '&center=139.75,35.68&radius=60000&limit=30');
    if (!r.ok) throw new Error('施設の検索に失敗しました');
    return (await r.json()).results || [];
  }
  // 「東京都渋谷区渋谷2-24-12 渋谷スクランブルスクエア９階」→「東京都渋谷区渋谷2-24-12」
  const addrHead = a => {
    const s = half(a).split(/[\s　]/)[0];
    return AREA.test(s) && /\d/.test(s) ? s : '';
  };
  const looksLikeAddress = s => /\d/.test(half(s)) && /(区|市|町|村|丁目|番|号|-)/.test(half(s));
  // 50m以内の重複を1つにまとめる
  const dedupe = list => list.filter((c, i) => !list.slice(0, i).some(d => dist(c, d) < 50));

  async function findPlaces(q) {
    if (looksLikeAddress(q)) {
      const g = await gsi(q);
      if (g.length) return g.slice(0, 3);   // 候補は3件まで（枠の高さに収める）
    }
    // ビル名・施設名: OpenPOIで住所を取り、その住所を国土地理院の検索で位置にする（施設データの位置はずれていることがあるため）
    const k = key(q);
    const hits = (await poi(q)).filter(x => key(x.name).includes(k) || key(x.address).includes(k));
    const heads = [...new Set(hits.map(x => addrHead(x.address)).filter(Boolean))].slice(0, 4);
    let cands = [];
    for (const h of heads) {
      const g = await gsi(h);
      // 名前は入力欄に残っているので、ここは住所だけ（1行に収める）
      if (g.length) cands.push({ label: g[0].label, lat: g[0].lat, lng: g[0].lng });
    }
    cands = dedupe(cands);
    if (cands.length) return cands.slice(0, 3);
    // 住所が無い施設だけ当たった時: 施設データの位置のうち一番まとまっている所を使う
    const pts = hits.filter(x => isFinite(x.lat) && isFinite(x.lng));
    if (pts.length) {
      let best = null;
      for (const p of pts) {
        const near = pts.filter(o => dist(p, o) < 300);
        if (!best || near.length > best.length) best = near;
      }
      const lat = best.reduce((s, o) => s + o.lat, 0) / best.length, lng = best.reduce((s, o) => s + o.lng, 0) / best.length;
      return [{ label: '施設データの位置（目安）', lat, lng }];
    }
    // 駅名・地名など
    return (await gsi(q)).slice(0, 3);
  }

  // 結果は1つの形だけ（枠の高さを決めやすくするため）。候補が複数なら1件目を出し、行き先の行を選択欄にして切り替えてもらう
  function show(cands, i = 0) {
    const dest = cands[i];
    const m = dist(ORIGIN, dest);
    const o = `${ORIGIN.lat},${ORIGIN.lng}`, d = `${dest.lat},${dest.lng}`;
    const gm = mode => `https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${d}&travelmode=${mode}`;
    const to = cands.length > 1
      ? `<select id="pick" aria-label="行き先の候補">${cands.map((c, j) => `<option value="${j}"${j === i ? ' selected' : ''}>${esc(c.label)}</option>`).join('')}</select> まで`
      : `${esc(dest.label)} まで`;
    out.innerHTML = `
      <div class="result">
        <div class="to" title="${esc(dest.label)}">${to}</div>
        <div class="row">
          <span class="km">${fmt(m)}<small>直線距離</small></span>
          <span class="links"><a href="${gm('transit')}" target="_blank" rel="noopener" title="Googleマップが開きます">電車の時間</a><a href="${gm('bicycling')}" target="_blank" rel="noopener" title="Googleマップが開きます">自転車</a></span>
        </div>
        <p class="note">※道のりではない直線の距離です。電車・自転車はGoogleマップが開きます。境目に近い時は会社にご確認ください。</p>
      </div>`;
    const sel = document.getElementById('pick');
    if (sel) sel.addEventListener('change', () => show(cands, Number(sel.value)));
  }

  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const q = $('q').value.trim();
    if (!q) return;
    $('go').disabled = true;
    out.innerHTML = '<p class="msg">検索しています…</p>';
    try {
      const c = await findPlaces(q);
      if (!c.length) { out.innerHTML = '<p class="msg">見つかりませんでした。住所（区・町名・番地まで）で入れてみてください。</p>'; return; }
      show(c, 0);
    } catch (e) {
      out.innerHTML = `<p class="msg">${esc(e.message || '検索に失敗しました')}。少し待ってからもう一度お試しください。</p>`;
    } finally {
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
