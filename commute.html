<!doctype html>
<!--
  commute.html — 物件ページに埋め込む「会社・目的地までの距離」（KATAROKU）

  会社の住所かビル名を入れると、物件からの直線距離を出し、電車・自転車での行き方は Googleマップを開くリンクで案内する。
  ・物件の位置は ?ll=緯度,経度 で渡す（?lat=…&lng=… でも可）
  ・位置の検索: 住所は国土地理院の住所検索、ビル名は OpenPOI API（施設の住所を取り、その住所を国土地理院の検索で位置にする）
  ※ このファイルは kataroku-bot リポジトリの widgets/commute.html を写したもの。直す時はそちらを直して写す
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>会社までの距離</title>
<style>
  :root { --red: #d61d1d; --ink: #333; --sub: #666; --line: #ccc; }
  * { box-sizing: border-box; }
  /* ⚠⚠ 埋め込みの高さは固定（add_commute_widget.js の HEIGHT＝138px）。iframe は中身に合わせて伸ばせないので、
       【検索前も結果も同じ高さ】になるよう、各段の高さをピクセルで決めてある（和田さん「下の余白は結果を出すまで無しに」）:
         見出し20 ＋ 5 ＋ 検索バー40 ＋ 6 ＋ 結果の欄48（案内文2行／行き先＋距離の2行／見つからない時の2行）＋ 4 ＋ 出典15 ＝ 138
       字の大きさや文言を変えたら、幅320px（パソコンの右の欄）と356px（スマホ）で、案内文・結果が2行に収まるか確かめること
     ⚠ 背景は付けない（透明）。外側の余白も無し。建物ページの灰色の欄（#eee）に、上の行と頭を揃えて置く */
  html, body { background: transparent; }
  body { margin: 0; padding: 0; font: 14px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; color: var(--ink); overflow: hidden; }
  h1 { font-size: 13px; line-height: 20px; height: 20px; margin: 0 0 5px; color: var(--red); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 検索バーは入力欄1つだけ（和田さん「このくらいシンプルでいい」）。左の虫眼鏡を押しても、Enter（スマホは「検索」キー）でも調べる。
     角の丸みはサイトの部品に揃えて4px（ヘッダーの検索欄4px・検索ボタン5px・ほかの枠やカードは0）。高さ40pxは指で押しやすい大きさ */
  form { position: relative; height: 40px; }
  input[type=search] { display: block; width: 100%; height: 40px; margin: 0; padding: 0 12px 0 38px; border: 1px solid #c9ced6; border-radius: 4px;
    background: #fff; color: var(--ink); font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; box-shadow: 0 1px 2px rgba(24, 33, 46, .06); }
  input[type=search]::-webkit-search-decoration, input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; }
  input[type=search]::placeholder { color: #9aa1ab; }
  input[type=search]:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 2px rgba(214, 29, 29, .12); }
  .icon { position: absolute; left: 0; top: 0; width: 38px; height: 40px; padding: 0; border: 0; background: none; color: #6b7280; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon:disabled { opacity: .5; cursor: default; }
  #out { height: 48px; margin-top: 6px; overflow: hidden; }
  .help, .msg { margin: 0; font-size: 12px; line-height: 18px; color: var(--sub); }
  /* 結果は1行: 左に行き先と距離、右に押しやすいボタン2つ（高さ40px・スマホで指で押せる大きさ） */
  .res { display: flex; align-items: center; gap: 6px; height: 44px; }
  .dest { flex: 1; min-width: 0; display: block; text-align: left; padding: 0; margin: 0; border: 0; background: none; color: var(--ink); font: inherit; }
  button.dest { cursor: pointer; }
  .to { display: block; font-size: 11px; line-height: 16px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .km { display: block; font-size: 20px; line-height: 26px; font-weight: 700; white-space: nowrap; }
  .km small { font-size: 11px; font-weight: 400; color: var(--sub); margin-left: 3px; }
  .btn { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 10px; border: 1px solid var(--red); border-radius: 4px; background: #fff; color: var(--red); font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .btn:active { background: #fdecec; }
  .credit { margin: 4px 0 0; font-size: 10px; line-height: 15px; height: 15px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .credit a { color: #999; }
</style>
</head>
<body>
<h1>この物件から会社・目的地までの距離</h1>
<form id="f" role="search">
  <input type="search" id="q" placeholder="会社の住所・ビル名・駅名" enterkeyhint="search" autocomplete="off" aria-label="会社の住所・ビル名・駅名">
  <button id="go" class="icon" type="submit" aria-label="調べる"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
</form>
<div id="out"><p class="help">会社の住所かビル名で、直線距離と電車での行き方が分かります。家賃補助の確認にも。</p></div>
<p class="credit">位置の検索：<a href="https://maps.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a>・<a href="https://openpoiapi.com/attribution.html" target="_blank" rel="noopener">OpenPOI API</a></p>

<script>
(() => {
  const P = new URLSearchParams(location.search);
  // 建物の位置は ?ll=緯度,経度（備考の iframe はこの形。& を使うと CMS や HTML で &lng が文字参照に化ける心配がある）
  // ⚠ Number(null) は 0 になり、位置が無いのに赤道上の(0,0)から測ってしまう。parseFloat なら NaN
  const ll = (P.get('ll') || '').split(',');
  const ORIGIN = { lat: parseFloat(P.get('lat') ?? ll[0]), lng: parseFloat(P.get('lng') ?? ll[1]) };
  const $ = id => document.getElementById(id);
  const out = $('out');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (!isFinite(ORIGIN.lat) || !isFinite(ORIGIN.lng)) { $('go').disabled = true; out.innerHTML = '<p class="msg">物件の位置が設定されていません。</p>'; return; }

  // 首都圏だけを候補にする（同じ地名が全国にあるため）
  const AREA = /^(東京都|神奈川県|埼玉県|千葉県)/;
  const half = s => String(s || '').replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－‐―−]/g, '-');
  const key = s => half(s).replace(/[\s　・･]/g, '').toLowerCase();
  const short = t => half(t).replace(AREA, '');   // 「東京都渋谷区渋谷二丁目２４番１２号」→「渋谷区渋谷二丁目24番12号」（枠に収めるため短く）

  // 2点の直線距離（m）
  const dist = (a, b) => {
    const R = 6371008.8, r = Math.PI / 180;
    const h = Math.sin((b.lat - a.lat) * r / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lng - a.lng) * r / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  const fmt = m => m < 1000 ? `約${Math.round(m / 10) * 10}m` : `約${(m / 1000).toFixed(2)}km`;

  // 首都圏の範囲（駅の結果には都県名が付かないので、位置で絞る）
  const IN_AREA = p => p.lat > 34.8 && p.lat < 36.6 && p.lng > 138.6 && p.lng < 140.95;
  async function gsiRaw(q) {
    const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('住所検索に失敗しました');
    return (await r.json()).map(x => ({ title: x.properties.title, lat: x.geometry.coordinates[1], lng: x.geometry.coordinates[0] }));
  }
  async function gsi(q) {
    return (await gsiRaw(q)).filter(x => AREA.test(x.title)).map(x => ({ label: short(x.title), lat: x.lat, lng: x.lng }));
  }
  // 近い候補（既定400m以内）は1つにまとめる（同じ駅の線ごとの点・同じビルの別の区画など）。先に出た方の名前を使い、位置は平均
  const clusters = (pts, r = 400) => {
    const out = [];
    for (const p of pts) {
      const c = out.find(x => dist(x, p) < r);
      if (c) { c.n++; c.lat += (p.lat - c.lat) / c.n; c.lng += (p.lng - c.lng) / c.n; }
      else out.push({ label: p.label, lat: p.lat, lng: p.lng, n: 1 });
    }
    return out;
  };
  // 駅: 国土地理院は駅名を「新橋駅」の形で返す（大きい駅は線ごとに数点）。名前がぴったり一致する点だけを使う。
  //   ⚠ これを住所の絞り込み（都県名で始まる）に通すと駅が全部落ち、近くのお店の住所が出てしまう（「新橋駅」→新橋一丁目・2026-10-03）
  async function station(q) {
    const name = /駅$/.test(q) ? q : q + '駅';
    // 大きい駅は線ごとの点が数百m散らばる（大手町駅は4点で約600m・東京駅は約650m）ので、駅は1kmでまとめる。
    // 蔵前（浅草線と大江戸線・約290m）のように別の駅として離れているものも1つになる（中心から測る）
    const cs = clusters((await gsiRaw(name)).filter(x => x.title === name && IN_AREA(x)).map(x => ({ label: name, lat: x.lat, lng: x.lng })), 1000);
    if (cs.length < 2) return cs;
    // 同じ名前の駅が離れた所にもある時だけ、町名を付けて見分けられるようにする
    for (const c of cs) {
      try {
        const r = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${c.lat}&lon=${c.lng}`);
        const town = (((await r.json()) || {}).results || {}).lv01Nm;
        if (town) c.label = `${name}（${town}）`;
      } catch (e) { /* 町名が取れなくても候補は出す */ }
    }
    return cs;
  }
  async function poi(q) {
    const r = await fetch('https://api.openpoiapi.com/v1/search?q=' + encodeURIComponent(q) + '&center=139.75,35.68&radius=60000&limit=30');
    if (!r.ok) throw new Error('施設の検索に失敗しました');
    return (await r.json()).results || [];
  }
  // 「東京都渋谷区渋谷2-24-12 渋谷スクランブルスクエア９階」→「東京都渋谷区渋谷2-24-12」
  const addrHead = a => {
    const s = half(a).split(/[\s　]/)[0];
    return AREA.test(s) && /\d/.test(s) ? s : '';
  };
  const looksLikeAddress = s => /\d/.test(half(s)) && /(区|市|町|村|丁目|番|号|-)/.test(half(s));

  async function findPlaces(q) {
    if (looksLikeAddress(q)) {
      const g = clusters(await gsi(q));
      if (g.length) return g.slice(0, 3);
    }
    // 駅名（「駅」が無くても、同じ名前の駅があれば駅として扱う。「新橋」→新橋駅）
    const st = await station(q);
    if (st.length) return st.slice(0, 3);
    // ビル名・施設名: OpenPOIで住所を取り、その住所を国土地理院の検索で位置にする（施設データの位置はずれていることがあるため）
    const k = key(q);
    const hits = (await poi(q)).filter(x => key(x.name).includes(k) || key(x.address).includes(k));
    const heads = [...new Set(hits.map(x => addrHead(x.address)).filter(Boolean))].slice(0, 4);
    let cands = [];
    for (const h of heads) {
      const g = await gsi(h);
      // 名前は入力欄に残っているので、ここは住所だけ（1行に収める）
      if (g.length) cands.push({ label: g[0].label, lat: g[0].lat, lng: g[0].lng });
    }
    cands = clusters(cands);
    if (cands.length) return cands.slice(0, 3);
    // 住所が無い施設だけ当たった時: 施設データの位置のうち一番まとまっている所を使う
    const pts = hits.filter(x => isFinite(x.lat) && isFinite(x.lng));
    if (pts.length) {
      let best = null;
      for (const p of pts) {
        const near = pts.filter(o => dist(p, o) < 300);
        if (!best || near.length > best.length) best = near;
      }
      const lat = best.reduce((s, o) => s + o.lat, 0) / best.length, lng = best.reduce((s, o) => s + o.lng, 0) / best.length;
      return [{ label: '施設データの位置（目安）', lat, lng }];
    }
    // 地名など
    return clusters(await gsi(q)).slice(0, 3);
  }

  // 結果は1つの形だけ（枠の高さを変えられないため）: 左に「行き先まで／約◯km 直線」、右にボタン2つ。
  //   離れた所に同じ名前の候補がある時だけ、左の行き先の部分を押すと次の候補に切り替わる（選択欄はスマホで押しにくいのでやめた）
  function show(cands, i = 0) {
    const dest = cands[i];
    const m = dist(ORIGIN, dest);
    const o = `${ORIGIN.lat},${ORIGIN.lng}`, d = `${dest.lat},${dest.lng}`;
    const gm = mode => `https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${d}&travelmode=${mode}`;
    const multi = cands.length > 1;
    const tag = multi ? 'button' : 'div';
    out.innerHTML = `
      <div class="res">
        <${tag} class="dest"${multi ? ' type="button" id="next"' : ''} title="${esc(dest.label)}${multi ? '（押すと次の候補）' : ''}">
          <span class="to">${multi ? `⇄ 候補${i + 1}/${cands.length} ` : ''}${esc(dest.label)}まで</span>
          <span class="km">${fmt(m)}<small>直線</small></span>
        </${tag}>
        <a class="btn" href="${gm('transit')}" target="_blank" rel="noopener" title="Googleマップが開きます">電車の時間 ↗</a>
        <a class="btn" href="${gm('bicycling')}" target="_blank" rel="noopener" title="Googleマップが開きます">自転車 ↗</a>
      </div>`;
    const nx = document.getElementById('next');
    if (nx) nx.addEventListener('click', () => show(cands, (i + 1) % cands.length));
  }

  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const q = $('q').value.trim();
    if (!q) return;
    $('go').disabled = true;
    out.innerHTML = '<p class="msg">検索しています…</p>';
    try {
      const c = await findPlaces(q);
      if (!c.length) { out.innerHTML = '<p class="msg">見つかりませんでした。住所（区・町名・番地まで）で入れてみてください。</p>'; return; }
      show(c, 0);
    } catch (e) {
      out.innerHTML = `<p class="msg">${esc(e.message || '検索に失敗しました')}。少し待ってからもう一度お試しください。</p>`;
    } finally {
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
