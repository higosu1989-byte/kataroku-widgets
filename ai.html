<!doctype html>
<!--
  ai.html — 物件ページに埋め込む「この物件についてAIに質問」（KATAROKU・試験中）

  このページに載っている情報（空室・賃料・ペット・設備など）をもとに、AIが短く答える。
  ・建物は ?e=建物ID で渡す。部屋のページから開かれた時は、埋め込み元のURL（referrer）から部屋IDを読む
  ・質問は中継（Google Apps Script）に送る。AIのキーはこのページには無い
  ・回答に出てきた号室は、その部屋のページへのリンクにする。部屋ページの番号は中継が建物ページから取って返す（rooms）。
    AIが書いたURLは使わない（間違ったURLや、よそのサイトへのリンクを出さないため）
  ・ほかの物件を聞かれた時（「他に有明に1LDKある？」）は、中継が掲載中の物件から候補を選び、「建物名 号室」と部屋ページのURLを links で返す
  ※ 元のファイルは非公開のリポジトリにある。直す時は元を直してから、公開用のリポジトリへ写す
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AIに質問</title>
<style>
  :root { --red: #d61d1d; --ink: #333; --sub: #666; --line: #ccc; }
  * { box-sizing: border-box; }
  /* ⚠⚠ 埋め込みの高さは固定（122px）。iframe は中身に合わせて伸ばせないので、質問前も回答後も同じ高さになるよう各段の高さを決めてある:
       入力欄40 ＋ 6 ＋ 回答の欄57（3行分。長い回答はこの中でスクロール） ＋ 4 ＋ 注記15 ＝ 122
     質問前は、回答の欄に説明を1行だけ出す（上下の中央に置く）。質問の例は入力欄の中に出す
     質問した後は入力欄を空にし、聞いた質問を入力欄の薄い文字に残す（回答の欄を回答だけに使い、続けて聞く時は消さずに打てる）
     回答に続きがある時は、欄の下の端を薄くして知らせる（いちばん下までスクロールしたら戻す）
     ⚠⚠ 各行は【かなが全角幅の字】（iPhone・Androidの字）で幅330px以内に収める。Windowsの字（Yu Gothic UI）はかなが細いので、
        パソコンで1行に収まっても電話では折り返す（12pxの全角で27字・英字は2字で1字分ほど）
     「LINEで相談」は答えの下だとスクロールしないと見えないので、いちばん下の注記の行にいつも出す
     見た目は「会社・目的地までの距離」（commute.html）に揃える: 背景なし・角4px・入力欄40px
     外側の余白はなし。ただし幅が480pxより狭い時（スマホで画面の幅いっぱいに置かれた時）は、文字が画面の端に付かないよう左右に12px取る */
  html, body { background: transparent; }
  body { margin: 0; padding: 0; font: 14px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; color: var(--ink); overflow: hidden; }
  @media (max-width: 479px) { body { padding: 0 12px; } }
  form { position: relative; height: 40px; }
  input[type=text] { display: block; width: 100%; height: 40px; margin: 0; padding: 0 44px 0 12px; border: 1px solid #c9ced6; border-radius: 4px;
    background: #fff; color: var(--ink); font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; box-shadow: 0 1px 2px rgba(24, 33, 46, .06); }
  input[type=text]::placeholder { color: #9aa1ab; }
  input[type=text]:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 2px rgba(214, 29, 29, .12); }
  .send { position: absolute; right: 0; top: 0; width: 44px; height: 40px; padding: 0; border: 0; background: none; color: var(--red); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .send:disabled { color: #b8bec7; cursor: default; }
  #out { height: 57px; margin-top: 6px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #out.idle { display: flex; align-items: center; overflow: hidden; }
  #out.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 16px), transparent); mask-image: linear-gradient(#000 calc(100% - 16px), transparent); }
  .help, .msg { margin: 0; font-size: 12px; line-height: 18px; color: var(--sub); }
  .a { margin: 0; font-size: 13px; line-height: 19px; white-space: pre-wrap; word-break: break-word; }
  .a a { color: var(--red); text-decoration: underline; text-underline-offset: 2px; }
  /* 回答の中の「LINEでお問合せ下さい」は、LINEの緑のボタン風のリンクにして目立たせる（行の高さは変えない） */
  .a a.line, .msg a.line { display: inline-block; padding: 0 9px; margin: 0 2px; border-radius: 999px; background: #06c755; color: #fff; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .wait::after { content: ''; display: inline-block; width: 1.5em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .credit { margin: 4px 0 0; font-size: 10px; line-height: 15px; height: 15px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .credit a { color: var(--red); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<form id="f">
  <input type="text" id="q" placeholder="例：いちばん安い1LDKは？" enterkeyhint="send" autocomplete="off" maxlength="200" aria-label="この物件についてAIに質問">
  <button id="go" class="send" type="submit" aria-label="送る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</form>
<div id="out" class="idle" aria-live="polite"><p class="help">このページの空室・賃料・設備などからAIがお答えします。</p></div>
<p class="credit">AIの回答は最終更新時点の目安です。正確な条件は <a href="https://customer.cloud.canary-app.com/kataroku-honten/create-customer" target="_blank" rel="noopener">LINEで相談 ›</a></p>

<script>
(() => {
  // 中継（Google Apps Script のウェブアプリ）。デプロイしたURLをここに入れる
  const PROXY = 'https://script.google.com/macros/s/AKfycbxWJCz1yYMcMdVZn-kH7MiAU2IxRl5QHvv1jiB4naaYJgIPDIxnVFI8IYipvXi_Hz1nlA/exec';
  // 同じブラウザから1日に聞ける回数（使いすぎ・いたずら対策。続きは LINE へ）。全員合わせた1日の上限は中継の DAILY_CAP（30回）。
  // 数えるのはAIが答えた分だけ（決まった答え・つながらなかった時は数えない）。日付は日本時間。
  // 数える場所はこのブラウザの保存領域。使えない時（プライベートブラウズなど）は、この閲覧の間だけ数える
  const MAX_PER_DAY = 5;
  const CK = 'kataroku_ai_count';
  const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  let counted = { d: today(), n: 0 };
  const usedToday = () => {
    try { const v = JSON.parse(localStorage.getItem(CK) || 'null'); if (v && v.d === today()) counted = v; else counted = { d: today(), n: 0 }; }
    catch (e) { if (counted.d !== today()) counted = { d: today(), n: 0 }; }
    return counted.n;
  };
  const addUse = () => { usedToday(); counted.n++; try { localStorage.setItem(CK, JSON.stringify(counted)); } catch (e) { /* この閲覧の間だけ数える */ } };

  const P = new URLSearchParams(location.search);
  const ESTATE = (P.get('e') || '').replace(/\D/g, '');
  // 部屋のページから開かれた時は部屋IDも送る（埋め込みに referrerpolicy が無いと、建物のURLしか届かないので建物の情報だけで答える）
  let ROOM = '';
  try { const m = document.referrer.match(/\/building\/(\d+)\/(\d+)\//); if (m && m[1] === ESTATE) ROOM = m[2]; } catch (e) { }
  // 試す時だけ: 手元（localhost）では ?proxy= で中継を差し替えられる
  const proxy = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && P.get('proxy')) || PROXY;

  const $ = id => document.getElementById(id);
  const out = $('out'), q = $('q'), go = $('go');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 回答の中の「711号室」を、その部屋のページへのリンクにする（esc した後に、中継が返した番号（数字だけ）でリンクを組む）。
  // 押すとページごとその部屋へ移る（部屋のページにもこの質問欄がある）
  // 「LINEでお問合せ下さい」「LINEでご確認ください」などを、LINEの相談の入口（下の「LINEで相談」と同じ）へのリンクにする
  const LINE = 'https://customer.cloud.canary-app.com/kataroku-honten/create-customer';
  const lineA = t => '<a class="line" href="' + LINE + '" target="_blank" rel="noopener">' + t + '</a>';
  const linkLine = html => html.replace(/LINE[^。、！!？?\n<⟦]{0,14}/g, m => lineA(m));
  const linkRooms = (html, rooms) => html.replace(/([A-Za-z0-9-]{1,12})号室/g, (m, no) =>
    rooms && Object.prototype.hasOwnProperty.call(rooms, no) && /^\d+$/.test(rooms[no])
      ? '<a href="https://kataroku.jp/building/' + ESTATE + '/' + rooms[no] + '/" target="_top">' + no + '号室</a>' : m);
  // ほかの物件（「他に有明に1LDKある？」など）: 中継が返す [「建物名 号室」, 部屋ページのURL]。URL は kataroku.jp の部屋ページの形だけ使う。
  // ⚠ 先に印（⟦0⟧）に置き換えてから、この建物の号室をリンクにする。順番が逆だと、別の建物の「1203号室」が
  //   この建物の1203号室へのリンクになってしまう
  const linkAll = (text, rooms, links) => {
    let html = esc(text);
    const marks = [];
    (Array.isArray(links) ? links : []).forEach(l => {
      if (!Array.isArray(l) || typeof l[0] !== 'string' || !/^https:\/\/kataroku\.jp\/building\/\d+\/\d+\/$/.test(l[1] || '')) return;
      const t = esc(l[0]);
      if (!t || html.indexOf(t) < 0) return;
      const i = marks.push('<a href="' + l[1] + '" target="_top">' + t + '</a>') - 1;
      html = html.split(t).join('⟦' + i + '⟧');
    });
    return linkRooms(linkLine(html), rooms).replace(/⟦(\d+)⟧/g, (m, i) => marks[i] || '');
  };
  // 続きがあれば下の端を薄くする（いちばん下まで読んだら戻す）
  const fade = () => out.classList.toggle('more', !out.classList.contains('idle') && out.scrollHeight - out.scrollTop - out.clientHeight > 2);
  const say = (html, idle) => { out.className = idle ? 'idle' : ''; out.innerHTML = html; out.scrollTop = 0; fade(); };
  out.addEventListener('scroll', fade, { passive: true });
  if (!ESTATE || /PROXY_URL/.test(proxy)) { q.disabled = go.disabled = true; say('<p class="msg">準備中です。</p>', true); return; }

  const hist = [];
  let busy = false;
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const text = q.value.trim();
    if (!text || busy) return;
    if (usedToday() >= MAX_PER_DAY) { say('<p class="msg">試験運用中のため' + MAX_PER_DAY + '問までです。続きは' + lineA('LINEでお気軽にご相談') + 'ください。</p>'); return; }
    busy = true; go.disabled = true;
    say('<p class="msg wait">回答を作っています</p>');
    let res;
    try {
      const ac = new AbortController();
      const timer = setTimeout(() => ac.abort(), 40000);
      // Content-Type を text/plain にして、事前確認（CORS のプリフライト）が起きない形で送る
      const r = await fetch(proxy, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ e: ESTATE, r: ROOM, q: text, h: hist }), signal: ac.signal });
      clearTimeout(timer);
      res = await r.json();
    } catch (e) { res = { error: 'network' }; }
    busy = false; go.disabled = false;
    if (res && res.answer) {
      // 決まった答え（悪口・「本当に空いてる？」など。AIを呼んでいない）は、続けて聞く時の材料に入れず、1日の回数にも数えない
      if (!res.canned) {
        addUse();
        hist.push({ role: 'user', content: text }, { role: 'assistant', content: res.answer });
        while (hist.length > 4) hist.shift();
      }
      // 聞いた質問は入力欄の薄い文字に残す（続けて聞く時に消さなくてよい）
      q.value = ''; q.placeholder = text;
      let html = linkAll(res.answer, res.rooms, res.links);
      // 決まった答え（悪口・記号だけ・他社キャンペーン・本当に空いてる？）には、いつもLINEの入口を付ける（文にLINEが無い時は後ろに足す）
      if (res.canned && html.indexOf('class="line"') < 0) html += lineA('LINEでのお問い合わせ') + 'お待ちしております。';
      say('<p class="a">' + html + '</p>');
    } else {
      // うまくいかなかった時は質問を入力欄に残す（そのまま送り直せる）
      const m = res && res.error === 'daily_cap' ? '試験運用中のため、本日の受付は終了しました。' + lineA('LINEでご相談') + 'ください。'
        : 'うまくつながりませんでした。少し時間をおいてお試しください。';
      say('<p class="msg">' + m + '</p>');
    }
  });
})();
</script>
</body>
</html>
