<!doctype html>
<!--
  ai2.html — 物件ページに埋め込む「この物件についてAIに質問」の会話型（KATAROKU・試験中）

  このページに載っている情報（空室・賃料・ペット・設備など）をもとに、AIが短く答える。
  ・建物は ?e=建物ID で渡す。部屋のページから開かれた時は、埋め込み元のURL（referrer）から部屋IDを読む
  ・質問は中継（Google Apps Script）に送る。AIのキーはこのページには無い
  ・回答に出てきた号室は、その部屋のページへのリンクにする。部屋ページの番号は中継が建物ページから取って返す（rooms）。
    AIが書いたURLは使わない（間違ったURLや、よそのサイトへのリンクを出さないため）
  ・ほかの物件を聞かれた時は、中継が掲載中の物件から候補を選び、「建物名 号室」と部屋ページのURLを links で返す
  ※ 元のファイルは非公開のリポジトリにある。直す時は元を直してから、公開用のリポジトリへ写す
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AIに質問</title>
<style>
  :root { --red: #d61d1d; --red-dark: #b71616; --ink: #222; --sub: #6b6f76; --line: #dfe1e5; }
  * { box-sizing: border-box; }
  /* 会話型: 上が会話（質問と✨の吹き出し）、下に入力欄、いちばん下に注記。
     埋め込みの高さ（iframe）に合わせて会話の欄が伸び縮みする（入力欄と注記はいつも見える）。
     見た目: 影やグラデーションは使わず、線と平らな色で描く。角は3px（サイトの部品に揃える）。
     ⚠ 各行は【かなが全角幅の字】（iPhone・Androidの字）で収まるかを見る。Windowsの字はかなが細い */
  html, body { height: 100%; background: transparent; }
  body { margin: 0; padding: 0; display: flex; flex-direction: column; overflow: hidden;
    font: 14px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; color: var(--ink); }
  @media (max-width: 479px) { body { padding: 0 12px; } }
  /* 質問する前: あいさつの吹き出しと質問の例のボタンをひとかたまりにして、上下の真ん中に置く
     （回答を出すための高さの残りが、上と下に半分ずつの余白になる。auto の余白はあふれると0になり、頭から読める） */
  #thread { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: 4px; display: flex; flex-direction: column; }
  #thread.idle > :first-child { margin-top: auto; }
  #thread.idle > :last-child { margin-bottom: auto; }
  #thread.idle .help { font-size: 14px; line-height: 22px; }
  .chips { padding-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: #333; font: inherit; font-size: 13px; line-height: 26px; cursor: pointer; white-space: nowrap; }
  .chips button:hover, .chips button:focus-visible { border-color: var(--red); color: var(--red); outline: none; }
  @media (max-width: 479px) { .chips button:nth-child(n+3) { display: none; } }   /* スマホは2つ（1行に収める） */
  #thread.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 18px), transparent); mask-image: linear-gradient(#000 calc(100% - 18px), transparent); }
  .me { display: flex; justify-content: flex-end; margin: 0 0 6px; }
  .me span { max-width: 80%; padding: 3px 10px; border-radius: 3px; background: #ececee; font-size: 13px; line-height: 20px; color: #333; word-break: break-word; }
  .bot { display: flex; gap: 8px; align-items: flex-start; }
  .sp { flex: none; width: 28px; height: 30px; display: flex; align-items: center; justify-content: center; }
  .sp svg { width: 24px; height: 24px; overflow: visible; }
  .busy .sp svg { animation: tw 1.4s ease-in-out infinite; }
  .busy .sp .small { animation: tw2 1.4s ease-in-out infinite; transform-origin: 19px 17px; }
  @keyframes tw { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.14) rotate(14deg); } }
  @keyframes tw2 { 0%, 100% { opacity: .45; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
  .bubble { position: relative; flex: 1; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; }
  .bubble::before { content: ''; position: absolute; left: -6px; top: 10px; width: 10px; height: 10px; background: #fff;
    border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
  .help, .msg { margin: 0; font-size: 13px; line-height: 21px; color: var(--sub); }
  .help .pi { font-size: 11px; color: #9a9ea5; }
  .think { font-size: 14px; line-height: 24px; background: linear-gradient(90deg, #9a9ea5 0%, #9a9ea5 35%, #e2543a 50%, #9a9ea5 65%, #9a9ea5 100%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sh 1.6s linear infinite; }
  @keyframes sh { from { background-position: 100% 0; } to { background-position: -20% 0; } }
  .a { margin: 0; font-size: 15px; line-height: 24px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .a a { color: var(--red); text-decoration: underline; text-underline-offset: 3px; }
  .typing .a::after { content: ''; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--red); animation: cr .8s steps(2) infinite; }
  @keyframes cr { 50% { opacity: 0; } }
  .nw { white-space: nowrap; }   /* 「くださ／い。」のように途中で改行させない */
  /* 回答の中の LINE・電話の入口（平らな色・角3px） */
  .a a.line, .msg a.line { display: inline-block; padding: 0 10px; margin: 2px 2px 0; border-radius: 3px; background: #06c755; color: #fff; font-size: 14px; line-height: 22px;
    font-weight: 700; text-decoration: none; white-space: nowrap; }
  .a a.tel { display: inline-block; padding: 0 10px; margin: 2px 2px 0; border-radius: 3px; border: 1px solid var(--red); color: var(--red); font-size: 14px; line-height: 20px;
    font-weight: 700; text-decoration: none; white-space: nowrap; }
  form { flex: none; position: relative; height: 42px; margin-top: 6px; }
  input[type=text] { display: block; width: 100%; height: 42px; margin: 0; padding: 0 48px 0 12px; border: 1px solid #c9ced6; border-radius: 3px;
    background: #fff; color: var(--ink); font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; }
  input[type=text]::placeholder { color: #9aa1ab; }
  input[type=text]:focus { outline: none; border-color: var(--red); }
  .send { position: absolute; right: 5px; top: 5px; width: 34px; height: 32px; padding: 0; border: 0; border-radius: 3px; background: var(--red); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .send:hover { background: var(--red-dark); }
  .send:disabled { background: #c9ced6; cursor: default; }
  .credit { flex: none; margin: 4px 0 0; font-size: 11px; line-height: 16px; height: 16px; color: #9a9ea5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .credit a { color: var(--red); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset=".55" stop-color="#e8332f"/><stop offset="1" stop-color="#c2185b"/></linearGradient>
    <symbol id="spark" viewBox="0 0 24 24"><path d="M10 2.5c.5 3.9 2.6 6 6.5 6.5-3.9.5-6 2.6-6.5 6.5-.5-3.9-2.6-6-6.5-6.5 3.9-.5 6-2.6 6.5-6.5z"/><path class="small" d="M18.5 13.5c.3 1.9 1.3 2.9 3.2 3.2-1.9.3-2.9 1.3-3.2 3.2-.3-1.9-1.3-2.9-3.2-3.2 1.9-.3 2.9-1.3 3.2-3.2z"/></symbol>
  </defs>
</svg>
<div id="thread" class="idle" aria-live="polite"><div class="bot"><span class="sp"><svg fill="url(#spg)" aria-hidden="true"><use href="#spark"/></svg></span><div class="bubble"><p class="help">この物件の空室・賃料・設備はもちろん、近くの物件探しもお手伝いします。<span class="pi">※個人情報のご入力はお控え下さい。</span></p></div></div><div class="chips"><button type="button" data-q="いちばん安い部屋は？">いちばん安い部屋は？</button><button type="button" data-q="初期費用はいくら？">初期費用はいくら？</button><button type="button" data-q="空いている間取りは？">空いている間取りは？</button></div></div>
<form id="f">
  <input type="text" id="q" placeholder="例：南向きのお部屋を教えて" enterkeyhint="send" autocomplete="off" maxlength="200" aria-label="この物件についてAIに質問">
  <button id="go" class="send" type="submit" aria-label="送る"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
</form>
<p class="credit">AIの回答は最終更新時点の目安です。正確な条件は <a href="https://customer.cloud.canary-app.com/kataroku-honten/create-customer" target="_blank" rel="noopener">LINEで相談 ›</a></p>

<script>
(() => {
  // 中継（Google Apps Script のウェブアプリ）
  const PROXY = 'https://script.google.com/macros/s/AKfycbxWJCz1yYMcMdVZn-kH7MiAU2IxRl5QHvv1jiB4naaYJgIPDIxnVFI8IYipvXi_Hz1nlA/exec';
  // 同じブラウザから1日に聞ける回数（使いすぎ・いたずら対策。続きは LINE へ）。全員合わせた1日の上限は中継の DAILY_CAP。
  // 数えるのはAIが答えた分だけ（決まった答え・つながらなかった時は数えない）。日付は日本時間
  const MAX_PER_DAY = 5;
  const CK = 'kataroku_ai_count';
  const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  let counted = { d: today(), n: 0 };
  const usedToday = () => {
    try { const v = JSON.parse(localStorage.getItem(CK) || 'null'); if (v && v.d === today()) counted = v; else counted = { d: today(), n: 0 }; }
    catch (e) { if (counted.d !== today()) counted = { d: today(), n: 0 }; }
    return counted.n;
  };
  const addUse = () => { usedToday(); counted.n++; try { localStorage.setItem(CK, JSON.stringify(counted)); } catch (e) { /* この閲覧の間だけ数える */ } };

  const P = new URLSearchParams(location.search);
  const ESTATE = (P.get('e') || '').replace(/\D/g, '');
  let ROOM = '';
  try { const m = document.referrer.match(/\/building\/(\d+)\/(\d+)\//); if (m && m[1] === ESTATE) ROOM = m[2]; } catch (e) { }
  const proxy = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && P.get('proxy')) || PROXY;
  // デザインの印（ボタンが押された記録に添える）。会話型は B
  const V = 'B';
  document.body.dataset.design = V;

  const $ = id => document.getElementById(id);
  const thread = $('thread'), q = $('q'), go = $('go');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LINE = 'https://customer.cloud.canary-app.com/kataroku-honten/create-customer';
  const lineA = t => '<a class="line" href="' + LINE + '" target="_blank" rel="noopener">' + t + '</a>';
  // 丸ごとボタンにするのは「LINEでお問合せ下さい」などの決まった言い方だけ（それ以外は「LINEで」までにして、言葉の途中で切らない）
  const linkLine = html => html.replace(/LINE(での|で|にて|から)?(お問い?合わ?せ|ご相談|相談|ご確認|確認)?(下さい|ください)?/g, m => lineA(m));
  const TEL = '03-6811-1402';
  const telA = () => '<a class="tel" href="tel:' + TEL.replace(/-/g, '') + '">電話 ' + TEL + '</a>';
  const linkRooms = (html, rooms) => html.replace(/([A-Za-z0-9-]{1,12})号室/g, (m, no) =>
    rooms && Object.prototype.hasOwnProperty.call(rooms, no) && /^\d+$/.test(rooms[no])
      ? '<a href="https://kataroku.jp/building/' + ESTATE + '/' + rooms[no] + '/" target="_top">' + no + '号室</a>' : m);
  // ほかの物件: 先に印（⟦0⟧）に置き換えてから、この建物の号室をリンクにする（別の建物の「1203号室」をこの建物の部屋と取り違えない）
  const linkAll = (text, rooms, links) => {
    let html = esc(text);
    const marks = [];
    (Array.isArray(links) ? links : []).forEach(l => {
      if (!Array.isArray(l) || typeof l[0] !== 'string' || !/^https:\/\/kataroku\.jp\/building\/\d+\/\d+\/$/.test(l[1] || '')) return;
      const t = esc(l[0]);
      if (!t || html.indexOf(t) < 0) return;
      const i = marks.push('<a href="' + l[1] + '" target="_top">' + t + '</a>') - 1;
      html = html.split(t).join('⟦' + i + '⟧');
    });
    return linkRooms(linkLine(html), rooms).replace(/⟦(\d+)⟧/g, (m, i) => marks[i] || '');
  };
  const SPARK = '<span class="sp"><svg fill="url(#spg)" aria-hidden="true"><use href="#spark"/></svg></span>';
  // 続きがあれば会話の下の端を薄くする（いちばん下まで読んだら戻す）
  const fade = () => thread.classList.toggle('more', thread.scrollHeight - thread.scrollTop - thread.clientHeight > 2);
  thread.addEventListener('scroll', fade, { passive: true });
  // 会話の欄を書き換える（question があれば右に質問、左に✨と吹き出し）
  const show = (question, inner, busy) => {
    thread.classList.remove('idle');
    thread.innerHTML = (question ? '<div class="me"><span>' + esc(question) + '</span></div>' : '')
      + '<div class="bot' + (busy ? ' busy' : '') + '">' + SPARK + '<div class="bubble">' + inner + '</div></div>';
    thread.scrollTop = 0; fade();
    return thread.querySelector('.bubble');
  };
  // 回答を一文字ずつ出す（リンクの文字も順に出す。LINE・電話の入口は一度に出す）。吹き出しを押すと最後まで出す
  let stopTyping = null;
  const typeInto = (bubble, html) => {
    if (stopTyping) stopTyping();
    const tpl = document.createElement('div');
    tpl.innerHTML = '<p class="a">' + html + '</p>';
    const steps = [];
    const walk = (src, dst) => {
      for (const n of Array.from(src.childNodes)) {
        if (n.nodeType === 3) { const t = document.createTextNode(''); dst.appendChild(t); steps.push({ t, s: n.nodeValue }); }
        else if (n.nodeType === 1 && n.matches('a.line, a.tel')) { const c = n.cloneNode(true); c.style.display = 'none'; dst.appendChild(c); steps.push({ el: c }); }
        else if (n.nodeType === 1) { const c = n.cloneNode(false); dst.appendChild(c); walk(n, c); }
      }
    };
    const p = document.createElement('p'); p.className = 'a';
    walk(tpl.firstChild, p);
    bubble.innerHTML = ''; bubble.appendChild(p);
    const total = steps.reduce((a, s) => a + (s.s ? s.s.length : 1), 0) || 1;
    const per = Math.max(10, Math.min(28, 3000 / total));
    let i = 0, c = 0, timer = null;
    thread.classList.add('typing'); thread.setAttribute('aria-busy', 'true');
    const done = () => { clearInterval(timer); thread.classList.remove('typing'); thread.removeAttribute('aria-busy'); stopTyping = null; bubble.removeEventListener('click', finish); fade(); };
    const finish = () => { for (; i < steps.length; i++) { const s = steps[i]; if (s.el) s.el.style.display = ''; else s.t.nodeValue = s.s; } done(); };
    stopTyping = finish;
    bubble.addEventListener('click', finish);
    timer = setInterval(() => {
      if (i >= steps.length) { done(); return; }
      const s = steps[i];
      if (s.el) { s.el.style.display = ''; i++; c = 0; }
      else { s.t.nodeValue += s.s.charAt(c++); if (c >= s.s.length) { i++; c = 0; } }
      fade();
    }, per);
  };

  if (!ESTATE || /PROXY_URL/.test(proxy)) { q.disabled = go.disabled = true; show('', '<p class="msg">準備中です。</p>'); return; }
  // 質問の例のボタン: 押すとその質問をそのまま送る
  thread.addEventListener('click', ev => {
    const b = ev.target && ev.target.closest && ev.target.closest('.chips button');
    if (!b || busy) return;
    q.value = b.dataset.q || b.textContent;
    const f = $('f');
    if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', { cancelable: true }));
  });

  const hist = [];
  let busy = false;
  let lastQ = '', lastKind = '';
  // LINE・電話のボタンが押されたら、記録だけ中継へ送る（AIは呼ばない・ページの移動は止めない）。直前の質問は lq に入れる
  document.addEventListener('click', ev => {
    const a = ev.target && ev.target.closest && ev.target.closest('a.line, a.tel, .credit a');
    if (!a) return;
    const where = a.closest('.credit') ? '注記' : a.closest('.msg') ? '上限の案内' : '答え:' + (lastKind || '?');
    const body = JSON.stringify({ ev: 'click', e: ESTATE, r: ROOM, k: a.classList.contains('tel') ? 'tel' : 'line', l: (a.textContent || '').trim().slice(0, 40), w: where, lq: lastQ, v: V });
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon(proxy, new Blob([body], { type: 'text/plain;charset=utf-8' }))))
        fetch(proxy, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, keepalive: true }).catch(() => {});
    } catch (e) { /* 記録できなくても移動は止めない */ }
  }, true);
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const text = q.value.trim();
    if (!text || busy) return;
    if (usedToday() >= MAX_PER_DAY) { lastQ = text; lastKind = '1日5問'; show(text, '<p class="msg">試験運用中のため' + MAX_PER_DAY + '問までです。続きは' + lineA('LINEでお気軽にご相談') + '<span class="nw">ください。</span></p>'); return; }
    busy = true; go.disabled = true;
    q.value = ''; q.placeholder = '続けて質問できます';
    show(text, '<span class="think">考えています…</span>', true);
    let res;
    try {
      const ac = new AbortController();
      const timer = setTimeout(() => ac.abort(), 40000);
      const r = await fetch(proxy, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ e: ESTATE, r: ROOM, q: text, h: hist, v: V }), signal: ac.signal });
      clearTimeout(timer);
      res = await r.json();
    } catch (e) { res = { error: 'network' }; }
    busy = false; go.disabled = false;
    lastQ = text;
    lastKind = res && res.answer ? (res.canned || 'AI') : res && res.error === 'daily_cap' ? '全体の上限' : 'エラー';
    if (res && res.answer) {
      if (!res.canned) {
        addUse();
        hist.push({ role: 'user', content: text }, { role: 'assistant', content: res.answer });
        while (hist.length > 4) hist.shift();
      }
      let html = linkAll(res.answer, res.rooms, res.links);
      html = html.replace(/([ぁ-んァ-ヶー一-龠々]{0,3}(ください|下さい|ます|です|ません)[。！!]?)$/, '<span class="nw">$1</span>');
      if (res.canned === 'hidden') html += '\n' + lineA('LINEで相談') + telA();
      else if (res.canned && ['offtopic', 'greet', 'thanks', 'who'].indexOf(res.canned) < 0 && html.indexOf('class="line"') < 0) html += lineA('LINEでのお問い合わせ') + 'お待ちしております。';
      typeInto(show(text, ''), html);
    } else {
      // うまくいかなかった時は質問を入力欄に戻す（そのまま送り直せる）
      q.value = text;
      const m = res && res.error === 'daily_cap' ? '試験運用中のため、本日の受付は終了しました。' + lineA('LINEでご相談') + '<span class="nw">ください。</span>'
        : 'うまくつながりませんでした。少し時間をおいてお試しください。';
      show(text, '<p class="msg">' + m + '</p>');
    }
  });
})();
</script>
</body>
</html>
